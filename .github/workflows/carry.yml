name: Carry Feishu Works
on:
  workflow_dispatch:

jobs:
  carry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run carry script
        run: python .github/scripts/carry_feishu.py
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          REPO_DIR: ${{ github.workspace }}

      - name: Commit and push
        run: |
          git config user.name "huanshan-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/CyborgTack/huanshan-film.git
          git add -A
          git diff --cached --quiet || git commit -m "carry: 飞书作品自动入库"
          git pull --rebase origin main
          git push origin main
